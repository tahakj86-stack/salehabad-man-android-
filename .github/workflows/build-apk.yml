
name: Build Salehabad APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'salehabad_man_android_project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          mkdir -p source
          unzip -q salehabad_man_android_project.zip -d source
          cd source/salehabad-android
          /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salehabad-man-apk
          path: source/salehabad-android/app/build/outputs/apk/debug/app-debug.apk
